<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pitch Matte Black Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <!-- 3D Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="150" y1="150" x2="874" y2="874" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2A1" />
      <stop offset="25%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#996515" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <!-- Neon Gold Rim Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Base -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Instagram-Inspired Inner Squircle Frame -->
  <rect x="192" y="192" width="640" height="640" rx="160" stroke="url(#goldGrad)" stroke-width="42" filter="url(#goldGlow)" />
  
  <!-- Top-Right Notification/Status Dot (Instagram Camera Flash Homage) -->
  <circle cx="700" cy="324" r="32" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Central Clock Ring -->
  <circle cx="512" cy="512" r="175" stroke="url(#goldGrad)" stroke-width="40" filter="url(#goldGlow)" />
  
  <!-- Combined Clock Hands + Checkmark Geometry -->
  <path d="M512 410 V512 L450 550" stroke="url(#goldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.45" />
  <path d="M435 515 L495 575 L645 415" stroke="url(#goldGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
</svg>
