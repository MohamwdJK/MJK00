name: Build APK & Deploy Web PWA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Convert SVG Icon to PNG
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          mkdir -p assets/icon
          rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o assets/icon/app_icon.png

      - name: Generate Android & Web Platform Files
        run: |
          flutter create . --project-name aureus_attendance --platforms=android,web --no-pub
          rm -f test/widget_test.dart

      - name: Resolve Dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate App Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release Android APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aureus-attendance-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web PWA
        run: flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aureus-attendance-web-pwa
          path: build/web
